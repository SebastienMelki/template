syntax = "proto3";

package example.v1;

import "example/v1/example.proto";
import "buf/validate/validate.proto";

// ListExamplesRequest is the input for listing examples.
message ListExamplesRequest {
  // Maximum number of results to return (default: 50, max: 100).
  int32 limit = 1 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  // Number of results to skip for pagination.
  int32 offset = 2 [(buf.validate.field).int32.gte = 0];
}

// ListExamplesResponse is returned when listing examples.
message ListExamplesResponse {
  // The list of examples.
  repeated example.v1.Example examples = 1;
  // Total number of examples available.
  int32 total_count = 2;
}
