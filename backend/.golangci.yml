version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gocritic
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - nakedret
    - prealloc
    - exportloopref
    - bodyclose
    - noctx
    - sqlclosecheck

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
  nakedret:
    max-func-lines: 30

issues:
  exclude-dirs:
    - api
    - internal/generated
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gocritic
